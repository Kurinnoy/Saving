<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Savings</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f3f5f9; color: #222; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  h1 { margin-top: 0; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .total { background: #eef3ff; border-radius: 8px; padding: 12px; text-align: center; }
  .total.all { background: #e3f6e8; }
  .total span { display: block; font-size: 13px; color: #555; }
  .total strong { font-size: 22px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
  label { font-size: 13px; color: #555; display: block; }
  input { width: 100%; padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: 9px 14px; font-size: 15px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
  button.secondary { background: #777; }
  button.danger { background: #d33; padding: 4px 8px; font-size: 13px; }
  button.edit { background: #888; padding: 4px 8px; font-size: 13px; }
  button.copy { background: #2f6fed; padding: 4px 8px; font-size: 13px; }
  button.spend { background: #e08a00; padding: 4px 8px; font-size: 13px; }
  .neg { color: #d33; }
  nav { margin-bottom: 16px; display: flex; gap: 16px; }
  nav a { color: #2f6fed; text-decoration: none; font-weight: bold; }
  nav a.current { color: #222; }
  .total small { display: block; font-size: 12px; color: #555; margin-top: 4px; }
  tr.child td { text-align: left; background: #fafafa; }
  .spends { list-style: none; margin: 0 0 10px; padding: 0; }
  .sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .section h4 { margin: 0 0 6px; }
  .spends li { display: flex; gap: 12px; align-items: center; padding: 3px 0; }
  .spends .who { width: 60px; font-weight: bold; }
  .spends .amt { width: 100px; text-align: right; }
  .spends .what { flex: 1; }
  .spends li.fixed { color: #555; }
  .spends li.fixed::after { content: ''; width: 58px; }
  .spendForm { display: flex; flex-wrap: wrap; gap: 8px; }
  .spendForm input, .spendForm select { width: auto; padding: 6px; font-size: 14px; }
  .spendForm input[name=note] { flex: 1; min-width: 120px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: right; border-bottom: 1px solid #e3e3e3; }
  th:first-child, td:first-child { text-align: left; }
  #foot td { font-weight: bold; }
  .scroll { overflow-x: auto; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .note { font-size: 12px; color: #777; }
</style>
</head>
<body>
<main>
  <h1>Family Savings</h1>
  <nav><a href="index.html" class="current">Family Savings</a><a href="salary.html">My salary</a><a href="config.html">Config</a><span id="syncStatus" class="note"></span></nav>

  <div class="card">
    <div class="totals" id="totals"></div>
  </div>

  <div class="card">
    <h2 id="formTitle">Add month</h2>
    <form id="form">
      <div><label for="month">Month</label><input type="month" id="month" required></div>
      <div><label for="me">My money</label><input type="number" id="me" min="0" step="0.01" value="0"></div>
      <div><label for="wife">Wife money</label><input type="number" id="wife" min="0" step="0.01" value="0"></div>
      <div><label for="son">Son money</label><input type="number" id="son" min="0" step="0.01" value="0"></div>
      <div>
        <button type="submit">Save</button>
        <button type="button" class="secondary" id="cancel" hidden>Cancel</button>
      </div>
    </form>
    <p class="note">Saving a month that already exists replaces its values.</p>
  </div>

  <div class="card">
    <h2>History</h2>
    <div class="scroll">
      <table id="table">
        <thead>
          <tr id="foot"></tr>
          <tr><th>Month</th><th>Me</th><th>Wife</th><th>Son</th><th>10%</th><th>Total</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="logic.js"></script>
<script src="sync.js"></script>
<script>
const KEY = 'familySavings';
const { FIELDS, PEOPLE, fmt, sum, salaryOf, allocationOf, withTenth, esc, spendingsOf, incomesOf, spentOf, incomeOf, leftOf, spentTotals, incomeTotals, totals: calcTotals,
  sortDesc, upsert, parseEntry, parseItem, addItem, removeItem } = Savings;
const LABELS = { me: 'Me', wife: 'Wife', son: 'Son', tenth: '10%' };
const open = new Set();
const $ = id => document.getElementById(id);
let data = [];

const persist = () => { sessionStorage.setItem(KEY, JSON.stringify(data)); GitSync.schedule(); };

function resetForm() {
  $('form').reset();
  $('month').value = new Date().toISOString().slice(0, 7);
  $('formTitle').textContent = 'Add month';
  $('cancel').hidden = true;
}

const money = n => `<span class="${n < 0 ? 'neg' : ''}">${fmt(n)}</span>`;

// History columns: what is left per person (saved + income - spent), then the 10% part.
const COLUMNS = [...PEOPLE, 'tenth'];

const SECTIONS = [
  { kind: 'incomes', title: 'Income', items: incomesOf, empty: 'No income yet', add: 'Add income', hint: 'From where?' },
  { kind: 'spendings', title: 'Spending', items: spendingsOf, empty: 'No spending yet', add: 'Add spending', hint: 'What for?' }
];

// Read-only income lines taken from the month's My salary details; they do not change any totals.
function salaryIncomeLines(e) {
  if (!(salaryOf(e) > 0 || e.allocation)) return '';
  const alloc = allocationOf(e);
  return PEOPLE.map(f => `
    <li class="fixed">
      <span class="who">${LABELS[f]}</span>
      <span class="what">From My salary</span>
      <span class="amt">${fmt(alloc[f])}</span>
    </li>`).join('');
}

function sectionHtml(e, sec) {
  const fixed = sec.kind === 'incomes' ? salaryIncomeLines(e) : '';
  const list = fixed + (sec.items(e).map(s => `
    <li>
      <span class="who">${LABELS[s.who]}</span>
      <span class="what">${esc(s.note)}</span>
      <span class="amt">${fmt(s.amount)}</span>
      <button class="danger" data-delitem="${esc(s.id)}" data-kind="${sec.kind}" data-month="${e.month}">Delete</button>
    </li>`).join('') || (fixed ? '' : `<li class="note">${sec.empty}</li>`));
  return `<div class="section">
    <h4>${sec.title}</h4>
    <ul class="spends">${list}</ul>
    <form class="spendForm" data-month="${e.month}" data-kind="${sec.kind}">
      <select name="who">${FIELDS.map(f => `<option value="${f}">${LABELS[f]}</option>`).join('')}</select>
      <input name="note" placeholder="${sec.hint}">
      <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      <button type="submit">${sec.add}</button>
    </form>
  </div>`;
}

function detailsHtml(e) {
  return `<tr class="child"><td colspan="7"><div class="sections">${SECTIONS.map(s => sectionHtml(e, s)).join('')}</div></td></tr>`;
}

function render() {
  data = withTenth(sortDesc(data));
  const totals = calcTotals(data);
  const spent = spentTotals(data);
  const income = incomeTotals(data);
  const small = k => `<small>Income ${fmt(income[k])} | Spent ${fmt(spent[k])} | Left ${money(totals[k] + income[k] - spent[k])}</small>`;

  $('totals').innerHTML =
    [['My money', 'me'], ['Wife money', 'wife'], ['Son money', 'son']]
      .map(([l, f]) => `<div class="total"><span>${l}</span><strong>${fmt(totals[f])}</strong>${small(f)}</div>`).join('');

  $('rows').innerHTML = data.map(e => `
    <tr>
      <td>${e.month}</td>
      ${COLUMNS.map(f => `<td>${money(leftOf(e, f))}</td>`).join('')}
      <td><strong>${money(leftOf(e))}</strong></td>
      <td>
        <button class="spend" data-spend="${e.month}">Income/Spending (${incomesOf(e).length}/${spendingsOf(e).length})</button>
      </td>
    </tr>${open.has(e.month) ? detailsHtml(e) : ''}`).join('') || '<tr><td colspan="7">No data yet</td></tr>';

  $('foot').innerHTML = data.length
    ? `<td>Total</td>${COLUMNS.map(f => `<td>${money(data.reduce((s, e) => s + leftOf(e, f), 0))}</td>`).join('')}<td><strong>${money(data.reduce((s, e) => s + leftOf(e), 0))}</strong></td><td></td>`
    : '';
}

$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  const values = Object.fromEntries(PEOPLE.map(f => [f, $(f).value]));
  const old = data.find(e => e.month === $('month').value);
  values.salary = old ? salaryOf(old) : 0; // salary is edited on the My salary page
  data = upsert(data, parseEntry($('month').value, values));
  persist();
  render();
  resetForm();
});

$('cancel').addEventListener('click', resetForm);

$('rows').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  const spending = parseItem({ who: f.who.value, note: f.note.value, amount: f.amount.value });
  if (!spending) return;
  data = addItem(data, f.dataset.month, f.dataset.kind, spending);
  persist();
  render();
});

$('rows').addEventListener('click', ev => {
  const { spend, delitem, kind, month } = ev.target.dataset;
  if (spend) {
    open.has(spend) ? open.delete(spend) : open.add(spend);
    render();
  } else if (delitem) {
    data = removeItem(data, month, kind, delitem);
    persist();
    render();
  }
});

resetForm();
render();
GitSync.ready().then(() => {
  data = JSON.parse(sessionStorage.getItem(KEY) || '[]');
  render();
});
</script>
</body>
</html>
