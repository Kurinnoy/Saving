<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Savings</title>
<style>
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f3f5f9; color: #222; }
  main { width: 90%; margin: 0 auto; padding: 20px; }
  h1 { margin-top: 0; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .totals { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 700px) { .totals { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
  .total { background: #eef3ff; border-radius: 8px; padding: 10px 6px; text-align: center; }
  .total.all { background: #e3f6e8; }
  .total span { display: block; font-size: 13px; color: #555; }
  .total strong { font-size: 18px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
  label { font-size: 13px; color: #555; display: block; }
  input { width: 100%; padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: 9px 14px; font-size: 15px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
  button.secondary { background: #777; }
  button.danger { background: #d33; padding: 4px 8px; font-size: 13px; }
  button.edit { background: #888; padding: 4px 8px; font-size: 13px; }
  button.copy { background: #2f6fed; padding: 4px 8px; font-size: 13px; }
  button.spend { background: #e08a00; padding: 4px 8px; font-size: 13px; }
  .neg { color: #d33; }
  nav { margin-bottom: 16px; display: flex; gap: 16px; }
  nav a { color: #2f6fed; text-decoration: none; font-weight: bold; }
  nav a.current { color: #222; }
  .total small { display: block; font-size: 12px; color: #555; margin-top: 4px; }
  tr.child td { text-align: left; background: #fafafa; }
  .items { margin-bottom: 10px; }
  .items th, .items td { text-align: left; }
  .items td.amt, .items th.amt { text-align: right; }
  .items .who { font-weight: bold; }
  .items .actions { white-space: nowrap; }
  .yearGroup td { background: #eef3ff; font-weight: bold; }
  .yearGroup button { padding: 4px 8px; font-size: 14px; }
  .items tr.fixed td { color: #555; }
  .items tr.income td.type { color: #1a7a35; }
  .items tr.spending td.type { color: #d33; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: #2f6fed; }
  .spendForm { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .spendForm input, .spendForm select { width: auto; padding: 6px; font-size: 14px; }
  .spendForm input[name=note] { flex: 1; min-width: 120px; }
  .incomeToggle { display: flex; align-items: center; gap: 4px; font-size: 14px; color: #222; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  .scroll > table { table-layout: fixed; }
  #headRow th:first-child { width: 128px; }
  #headRow th:last-child { width: 240px; }
  #headRow th { white-space: normal; overflow-wrap: anywhere; }
  #rows > tr:not(.child) > td { overflow-wrap: anywhere; }
  th, td { padding: 8px; text-align: right; border-bottom: 1px solid #e3e3e3; }
  th:first-child, td:first-child { text-align: left; }
  #foot td { font-weight: bold; }
  .scroll { overflow: auto; overflow-y: scroll; max-height: 80vh; scrollbar-gutter: stable; }
  .scroll > table > thead { position: sticky; top: 0; z-index: 2; }
  thead th, thead td { background: #fff; box-shadow: inset 0 -1px #e3e3e3; }
  /* Keeps the Income/Spending button in view when extra columns make the table scroll sideways. */
  #headRow th:last-child, #foot td:last-child, #rows > tr:not(.child) > td:last-child { position: sticky; right: 0; background: #fff; }
  /* The month details stay as wide as the visible table, so their Amount and Delete columns are never off-screen. */
  .detailsBox { position: sticky; left: 0; width: var(--view, 100%); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .note { font-size: 12px; color: #777; }
</style>
</head>
<body>
<main>
  <h1>Family Savings</h1>
  <nav><a href="salary.html">My salary</a><a href="index.html" class="current">Family Savings</a><a href="config.html">Config</a><span id="syncStatus" class="note"></span></nav>

  <div class="card">
    <div class="totals" id="totals"></div>
  </div>

  <div class="card">
    <div class="head"><h2>History</h2><button type="button" class="danger" id="clearHistory">Clear history</button></div>
    <div class="scroll">
      <table id="table">
        <thead>
          <tr id="headRow"></tr>
          <tr id="foot"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="logic.js"></script>
<script src="sync.js"></script>
<script src="settings.js"></script>
<script>
const KEY = 'familySavings';
const { fmt, salaryOf, salaryIncomeOf, defaultRowValue, rowBaseValue, allocationOf, withTenth, esc, spendingsOf, incomesOf, spentOf, incomeOf, leftOf,
  parseItem, addItem, removeItem, investmentLeftOf, savingLeftOf, monthLabel } = Savings;
let family = [];
let PEOPLE = [];
let LABELS = {};
// Closed months keep their exchange rates in the browser, which converts deductions set to UAH or EUR.
const storedRates = JSON.parse(localStorage.getItem('uahUsdRates') || '{}');
Savings.setRateLookup((month, currency) => storedRates[currency === 'USD' ? month : `${month}|${currency}`]);
let historyDefaultRows = [];
let historyOtherRows = [];
let tenthInHistory = false;
let tenthInTotal = false;
let tenthInBlocks = false;
let tenthInFooter = false;
let historyPeople = [];
let blockPeople = [];
let blockRows = [];
let detailRows = [];
let whoOptions = [];
// Line owner keys: saving, investment and 10% keep their own keys, every other row uses its id.
const whoOfRow = row => ({ monthly_saving: 'saving', monthly_investment: 'investment', rate_10: 'tenth' })[row.id] || row.id;
let footerIds = new Set();
// A row that is not included is not shown anywhere either.
const inDetails = item => item.enabled !== false;
const shown = (item, flag) => inDetails(item) && item[flag] !== false;
function refreshFamily() {
  const settings = AppSettings.load();
  family = settings.family.filter(person => person.enabled);
  PEOPLE = family.map(person => person.id);
  historyPeople = family.filter(person => shown(person, 'showInHistory') && shown(person, 'showInHistoryDetails'));
  blockPeople = family.filter(person => shown(person, 'showInBlocks'));
  LABELS = Object.fromEntries([...family.map(person => [person.id, person.name]), ['tenth', '10%'], ['investment', 'Investment'], ['saving', 'Monthly saving'], ['other', 'Other']]);
  // The 10% money has its own column, so the 10% deduction row is not listed a second time.
  const tenthRow = settings.defaultRows.find(row => row.id === 'rate_10');
  tenthInHistory = !!(tenthRow && inDetails(tenthRow) && tenthRow.showInHistory && tenthRow.showInHistoryDetails !== false);
  tenthInTotal = tenthInHistory && tenthRow.includeInTotal;
  tenthInBlocks = !!(tenthRow && inDetails(tenthRow) && tenthRow.showInBlocks);
  tenthInFooter = !!(tenthRow && shown(tenthRow, 'showInFooter'));
  historyDefaultRows = settings.defaultRows.filter(row => inDetails(row) && row.showInHistory && row.showInHistoryDetails !== false && row.id !== 'rate_10');
  historyOtherRows = settings.otherDefaults.filter(row => inDetails(row) && row.showInHistory && row.showInHistoryDetails !== false);
  blockRows = [...settings.defaultRows, ...settings.otherDefaults].filter(row => inDetails(row) && row.showInBlocks);
  detailRows = [...settings.defaultRows, ...settings.otherDefaults].filter(row => row.id !== 'other' && inDetails(row) && row.enabled !== false && row.showInHistoryDetails);
  const allRows = [...settings.defaultRows, ...settings.otherDefaults];
  allRows.forEach(row => { LABELS[whoOfRow(row)] = row.id === 'rate_10' ? '10%' : row.name; });
  whoOptions = [
    ...family.filter(person => shown(person, 'showInDropdown')).map(person => [person.id, person.name]),
    ...allRows.filter(row => inDetails(row) && row.showInDropdown).map(row => [whoOfRow(row), LABELS[whoOfRow(row)]])
  ];
  footerIds = new Set([...historyPeople.filter(person => shown(person, 'showInFooter')).map(person => person.id),
    ...[...historyDefaultRows, ...historyOtherRows].filter(row => shown(row, 'showInFooter')).map(row => row.id)]);
}
refreshFamily();
const open = new Set();
const $ = id => document.getElementById(id);
let data = [];

const persist = () => { sessionStorage.setItem(KEY, JSON.stringify(data)); GitSync.schedule(); };

const money = n => {
  const value = fmt(n);
  return `<span class="${value.startsWith('-') ? 'neg' : ''}">${value}</span>`;
};

// History columns: the family members shown in History, the 10% money when shown, and Other.
let COLUMNS = [...PEOPLE];

// Investment: the month's My salary investment plus its income and spending lines.
const investmentShown = investmentLeftOf;

// Monthly saving: the month's My salary saving plus its income and spending lines.
const savingShown = savingLeftOf;

// Row total: what is left for each person and Other, plus the 10% money and the history rows ticked "Include in Total".
const rowTotal = e => [...historyPeople.filter(person => shown(person, 'includeInTotal')).map(person => person.id), ...(tenthInTotal ? ['tenth'] : [])].reduce((s, f) => s + leftOf(e, f, family), 0)
  + [...historyDefaultRows, ...historyOtherRows].filter(row => row.includeInTotal).reduce((sum, row) => sum + defaultRowValue(e, row), 0);

let sort = { key: 'month', dir: 'desc' };
let HEAD = [];
let sortValue = {};

function refreshHistoryHead() {
  COLUMNS = [...historyPeople.map(person => person.id), ...(tenthInHistory ? ['tenth'] : [])];
  HEAD = [
    ['month', 'Month', e => e.month],
    ['total', 'Total', rowTotal],
    ...historyPeople.map(person => [person.id, person.name, e => leftOf(e, person.id, family)]),
    ...(tenthInHistory ? [['tenth', '10%', e => leftOf(e, 'tenth', family)]] : []),
    ...historyDefaultRows.map(row => [row.id, `${row.name} (${row.currency === '%' ? 'USD' : row.currency})`, e => defaultRowValue(e, row)]),
    ...historyOtherRows.map(row => [row.id, `${row.name} (${row.currency === '%' ? 'USD' : row.currency})`, e => defaultRowValue(e, row)])
  ];
  sortValue = Object.fromEntries(HEAD.map(([key, , value]) => [key, value]));
  if (!sortValue[sort.key]) sort = { key: 'month', dir: 'desc' };
}

refreshHistoryHead();

const sortData = arr => {
  const value = sortValue[sort.key];
  const dir = sort.dir === 'asc' ? 1 : -1;
  return [...arr].sort((a, b) => {
    const yearOrder = b.month.slice(0, 4).localeCompare(a.month.slice(0, 4));
    if (yearOrder) return sort.key === 'month' && sort.dir === 'asc' ? -yearOrder : yearOrder;
    const va = value(a), vb = value(b);
    const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return cmp * dir;
  });
};

const editingItems = new Map();
const expandedYears = new Set();

// One Income/Spending line of the details table; fixed lines come from My salary and cannot be deleted.
function itemRow(e, kind, s, fixed) {
  const income = kind === 'incomes';
  const action = fixed ? '' : `<button type="button" class="edit" data-edititem="${esc(s.id)}" data-kind="${kind}" data-month="${e.month}">Edit</button> <button type="button" class="danger" data-delitem="${esc(s.id)}" data-kind="${kind}" data-month="${e.month}">Delete</button>`;
  return `<tr class="${income ? 'income' : 'spending'}${fixed ? ' fixed' : ''}">
    <td class="type">${income ? 'Income' : 'Spending'}</td>
    <td class="who">${esc(LABELS[s.who] || s.who)}</td>
    <td>${esc(s.note)}</td>
    <td class="amt">${fmt(s.amount)}</td>
    <td class="actions">${action}</td>
  </tr>`;
}

// One table per month: all income lines first (My salary lines, then typed ones), then spending lines.
function detailsTable(e) {
  const rows = [];
  if (salaryOf(e) > 0 || e.allocation) {
    const alloc = allocationOf(e, family);
    family.filter(person => shown(person, 'showInHistoryDetails') && person.showIncome === true).forEach(person => rows.push(itemRow(e, 'incomes', { who: person.id, note: 'From My salary', amount: salaryIncomeOf(e, person.id, family) }, true)));
    // Saving, investment and the 10% are money set aside (income); every other monthly row is money going out.
    detailRows.filter(row => row.showIncome === true || !['monthly_saving', 'monthly_investment', 'rate_10'].includes(row.id)).forEach(row => rows.push(itemRow(e, ['monthly_saving', 'monthly_investment', 'rate_10'].includes(row.id) ? 'incomes' : 'spendings',
      { who: row.name, note: `From My salary (${row.currency === '%' ? 'USD' : row.currency})`, amount: rowBaseValue(e, row) }, true)));
  }
  incomesOf(e).forEach(s => rows.push(itemRow(e, 'incomes', s, false)));
  spendingsOf(e).forEach(s => rows.push(itemRow(e, 'spendings', s, false)));
  if (!rows.length) rows.push('<tr><td colspan="5" class="note">No income or spending yet</td></tr>');
  return `<table class="items">
    <thead><tr><th>Type</th><th>Who</th><th>Note</th><th class="amt">Amount</th><th></th></tr></thead>
    <tbody>${rows.join('')}</tbody>
  </table>`;
}

function detailsHtml(e) {
  const day = Savings.rateDate(e.month);
  const dateValue = `${day.slice(0, 4)}-${day.slice(4, 6)}-${day.slice(6, 8)}`;
  const editing = editingItems.get(e.month);
  const item = editing && (e[editing.kind] || []).find(saved => saved.id === editing.id);
  const options = item && !whoOptions.some(([id]) => id === item.who)
    ? [...whoOptions, [item.who, LABELS[item.who] || item.who]] : whoOptions;
  const form = `<form class="spendForm" data-month="${e.month}">
    <label class="incomeToggle"><input type="checkbox" name="income" ${item && editing.kind === 'incomes' ? 'checked' : ''}> Income</label>
    <select name="who" aria-label="Who">${options.map(([id, label]) => `<option value="${esc(id)}" ${item && item.who === id ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select>
    <input name="note" aria-label="Note" placeholder="${item && item.who === 'other' ? 'Description' : 'Note'}" value="${esc(item ? item.note : '')}" ${item && item.who === 'other' ? 'required' : ''}>
    <input name="amount" type="text" inputmode="text" aria-label="Amount" data-amount="${item ? item.amount : 0}" value="${item ? item.amount : ''}" placeholder="Amount" required>
    <select name="currency" aria-label="Currency">${['USD', 'UAH', 'EUR'].map(code => `<option value="${code}">${code}</option>`).join('')}</select>
    <input name="date" type="date" value="${dateValue}" aria-label="Date" required>
    <button type="submit">${item ? 'Save' : 'Add'}</button>
    ${item ? `<button type="button" class="secondary" data-cancelitem="${e.month}">Cancel</button>` : ''}
  </form>`;
  return `<tr class="child"><td colspan="${HEAD.length + 1}"><div class="detailsBox">${form}${detailsTable(e)}</div></td></tr>`;
}

function fitHistoryViewport() {
  const scroller = document.querySelector('.scroll');
  const top = Math.max(0, scroller.getBoundingClientRect().top);
  scroller.style.maxHeight = `${Math.max(160, window.innerHeight - top - 32)}px`;
}

function render() {
  document.querySelector('.scroll').style.setProperty('--view', `${document.querySelector('.scroll').clientWidth - 16}px`);
  data = withTenth(sortData(data));
  const saved = id => data.reduce((s, e) => s + (e[id] || 0), 0);
  const income = id => data.reduce((s, e) => s + incomeOf(e, id, family), 0);
  const spent = id => data.reduce((s, e) => s + spentOf(e, id), 0);
  const left = id => data.reduce((s, e) => s + leftOf(e, id, family), 0);
  const small = id => `<small>Saved ${fmt(saved(id))} | Income ${fmt(income(id))} | Spent ${fmt(spent(id))}</small>`;

  $('headRow').innerHTML = HEAD.map(([key, label]) => {
    const arrow = sort.key === key ? (sort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';
    return `<th class="sortable" data-key="${esc(key)}">${esc(label)}${arrow}</th>`;
  }).join('') + '<th></th>';
  $('table').style.minWidth = `${128 + (HEAD.length - 1) * 144 + 240}px`;

  // Same order as Config: family first, then the monthly rows (the 10% money sits where its row is).
  const blocks = [
    ...blockPeople.map(person => ({ label: `${person.name} money`, value: left(person.id), extra: small(person.id), inTotal: person.inBlocksTotal === true })),
    ...blockRows.map(row => row.id === 'rate_10'
      ? { label: '10% money', value: left('tenth'), extra: small('tenth'), inTotal: row.inBlocksTotal === true }
      : { label: row.name, value: data.reduce((s, e) => s + (row.id === 'monthly_saving' ? savingShown(e) : row.id === 'monthly_investment' ? investmentShown(e) : defaultRowValue(e, row)), 0), extra: '', inTotal: row.inBlocksTotal === true })
  ];
  const totalBlock = blocks.some(block => block.inTotal)
    ? `<div class="total all"><span>Total</span><strong>${money(blocks.filter(block => block.inTotal).reduce((s, block) => s + block.value, 0))}</strong></div>` : '';
  $('totals').innerHTML = totalBlock + blocks.map(block => `<div class="total"><span>${esc(block.label)}</span><strong>${money(block.value)}</strong>${block.extra}</div>`).join('');
  fitHistoryViewport();

  const footerShown = f => f === 'tenth' ? tenthInFooter : footerIds.has(f);
  const years = new Map();
  data.forEach(entry => {
    const year = entry.month.slice(0, 4);
    if (!years.has(year)) years.set(year, []);
    years.get(year).push(entry);
  });
  $('rows').innerHTML = [...years].map(([year, entries]) => {
    const collapsed = !expandedYears.has(year);
    const group = `<tr class="yearGroup">
      <td><button type="button" class="secondary" data-year="${year}" aria-expanded="${!collapsed}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${year}">${collapsed ? '&#9656;' : '&#9662;'} ${year}</button></td>
      <td><strong>${money(entries.reduce((sum, entry) => sum + rowTotal(entry), 0))}</strong></td>
      ${COLUMNS.map(id => `<td>${footerShown(id) ? money(entries.reduce((sum, entry) => sum + leftOf(entry, id, family), 0)) : ''}</td>`).join('')}
      ${[...historyDefaultRows, ...historyOtherRows].map(row => `<td>${footerIds.has(row.id) ? money(entries.reduce((sum, entry) => sum + defaultRowValue(entry, row), 0)) : ''}</td>`).join('')}
      <td></td>
    </tr>`;
    return group + (collapsed ? '' : entries.map(e => `
    <tr>
      <td>${monthLabel(e.month)}</td>
      <td><strong>${money(rowTotal(e))}</strong></td>
      ${COLUMNS.map(f => `<td>${money(leftOf(e, f, family))}</td>`).join('')}
      ${[...historyDefaultRows, ...historyOtherRows].map(row => `<td>${money(defaultRowValue(e, row))}</td>`).join('')}
      <td>
        <button class="spend" data-spend="${e.month}">Income/Spending (${incomesOf(e).length}/${spendingsOf(e).length})</button>
      </td>
    </tr>${open.has(e.month) ? detailsHtml(e) : ''}`).join(''));
  }).join('') || `<tr><td colspan="${HEAD.length + 1}">No data yet</td></tr>`;

  $('foot').innerHTML = data.length
    ? `<td>Total</td><td><strong>${money(data.reduce((s, e) => s + rowTotal(e), 0))}</strong></td>${COLUMNS.map(f => `<td>${footerShown(f) ? money(data.reduce((s, e) => s + leftOf(e, f, family), 0)) : ''}</td>`).join('')}${[...historyDefaultRows, ...historyOtherRows].map(row => `<td>${footerIds.has(row.id) ? money(data.reduce((s, e) => s + defaultRowValue(e, row), 0)) : ''}</td>`).join('')}<td></td>`
    : '';
}

$('clearHistory').addEventListener('click', () => {
  if (!data.length || !confirm('Delete all months, including their income and spending? This also empties My salary.')) return;
  data = [];
  open.clear();
  editingItems.clear();
  expandedYears.clear();
  GitSync.allowEmptyOnce();
  persist();
  render();
});

// NBU official rate for a date; looks back a few days when that date has none.
async function fetchNbuRate(currency, isoDate) {
  let date = isoDate.replace(/-/g, '');
  for (let i = 0; i < 5; i++) {
    const res = await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=${encodeURIComponent(currency)}&date=${date}&json`);
    if (!res.ok) throw new Error(res.status);
    const [row] = await res.json();
    if (row && row.rate > 0) return row.rate;
    date = Savings.prevDate(date);
  }
  throw new Error('no rate');
}

$('rows').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target;
  if (!f.classList.contains('spendForm') || f.dataset.saving === 'true') return;
  const { currency, date } = { currency: f.currency.value, date: f.date.value };
  const typed = Savings.resolveAmount(f.amount.value, Number(f.amount.dataset.amount));
  f.amount.setCustomValidity(typed === null || typed <= 0 ? 'Enter an amount greater than zero, an adjustment such as +10, or a calculation such as 100+10.' : '');
  if (!f.reportValidity()) return;
  const editing = editingItems.get(f.dataset.month);
  const button = f.querySelector('button[type=submit]');
  f.dataset.saving = 'true';
  button.disabled = true;
  let amount = typed;
  if (currency !== 'USD' && typed > 0) {
    try {
      const usdRate = await fetchNbuRate('USD', date);
      const foreign = currency === 'UAH' ? {} : { [currency]: await fetchNbuRate(currency, date) };
      amount = Savings.currencyToUsd(typed, currency, usdRate, foreign);
    } catch {
      delete f.dataset.saving;
      button.disabled = false;
      alert(`Could not get the ${currency} exchange rate for ${date}.`);
      return;
    }
  }
  const label = currency === 'USD' ? date : `${typed} ${currency}, ${date}`;
  const note = [f.note.value.trim(), `(${label})`].filter(Boolean).join(' ');
  const savedNote = editing && currency === 'USD' ? f.note.value.trim() : f.note.value.trim() ? note : label;
  const spending = parseItem({ who: f.who.value, note: savedNote, amount }, PEOPLE);
  if (!spending) { delete f.dataset.saving; button.disabled = false; return; }
  const kind = f.income.checked ? 'incomes' : 'spendings';
  data = editing
    ? Savings.updateItem(data, f.dataset.month, editing.kind, { ...spending, id: editing.id }, kind)
    : addItem(data, f.dataset.month, kind, spending);
  editingItems.delete(f.dataset.month);
  persist();
  render();
});

$('rows').addEventListener('input', ev => {
  if (ev.target.matches('.spendForm input[name="amount"]')) ev.target.setCustomValidity('');
});

$('rows').addEventListener('change', ev => {
  if (ev.target.name !== 'who') return;
  ev.target.form.elements.note.required = ev.target.value === 'other';
  ev.target.form.elements.note.placeholder = ev.target.value === 'other' ? 'Description' : 'Note';
});

$('rows').addEventListener('click', ev => {
  const { spend, delitem, edititem, cancelitem, kind, month, year } = ev.target.dataset;
  if (year) {
    expandedYears.has(year) ? expandedYears.delete(year) : expandedYears.add(year);
    render();
  } else if (spend) {
    open.has(spend) ? open.delete(spend) : open.add(spend);
    render();
  } else if (delitem) {
    data = removeItem(data, month, kind, delitem);
    if (editingItems.get(month)?.id === delitem) editingItems.delete(month);
    persist();
    render();
  } else if (edititem) {
    editingItems.set(month, { id: edititem, kind });
    render();
    const amount = document.querySelector(`.spendForm[data-month="${month}"] input[name="amount"]`);
    amount.focus();
    amount.select();
  } else if (cancelitem) {
    editingItems.delete(cancelitem);
    render();
  }
});

$('headRow').addEventListener('click', ev => {
  const { key } = ev.target.dataset;
  if (!key) return;
  if (sort.key === key) sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
  else sort = { key, dir: 'desc' };
  render();
});

render();
window.addEventListener('resize', render);
window.addEventListener('scroll', fitHistoryViewport, { passive: true });
GitSync.ready().then(() => {
  refreshFamily();
  refreshHistoryHead();
  data = JSON.parse(sessionStorage.getItem(KEY) || '[]');
  render();
});
</script>
</body>
</html>
