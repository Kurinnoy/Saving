<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My salary</title>
<style>
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f3f5f9; color: #222; }
  main { width: 90%; margin: 0 auto; padding: 20px; }
  h1 { margin-top: 0; }
  nav { margin-bottom: 16px; display: flex; gap: 16px; }
  nav a { color: #2f6fed; text-decoration: none; font-weight: bold; }
  nav a.current { color: #222; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
  label { font-size: 13px; color: #555; display: block; }
  input { width: 100%; padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: 9px 14px; font-size: 15px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
  button.secondary { background: #777; }
  button.danger { background: #d33; padding: 4px 8px; font-size: 13px; }
  button.edit { background: #888; padding: 4px 8px; font-size: 13px; }
  button.copy { background: #2f6fed; padding: 4px 8px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: right; border-bottom: 1px solid #e3e3e3; }
  th:first-child, td:first-child { text-align: left; }
  #foot td { font-weight: bold; }
  .scroll { overflow: auto; max-height: 80vh; }
  thead { position: sticky; top: 0; z-index: 2; }
  thead th, thead td { background: #fff; box-shadow: inset 0 -1px #e3e3e3; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .historyActions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .historyActions button { padding: 6px 10px; font-size: 14px; }
  #salaryIoStatus { min-height: 16px; margin: 0 0 8px; }
  .note { font-size: 12px; color: #777; }
  #formError { display: none; margin-top: 12px; padding: 12px 16px; border-radius: 6px; background: #fde4e4; color: #d00000; font-size: 20px; font-weight: bold; }
  .neg { color: #d33; }
  button.details { background: #e08a00; padding: 4px 8px; font-size: 13px; }
  tr.child td { text-align: left; background: #fafafa; }
  /* width 0 + min-width 100% keeps the open Details from widening the table columns above it. */
  .calc { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; width: 0; min-width: 100%; }
  .calc div { display: flex; flex-direction: column; gap: 4px; }
  .calc span { color: #555; font-size: 13px; }
  .calc strong { font-weight: 600; }
  .calc .rate strong { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .calc .rate button { padding: 4px 8px; font-size: 13px; }
  .calc form { display: contents; }
  .calc input { width: 100%; padding: 4px 6px; font-size: 14px; }
  .calc .save { grid-column: 1 / -1; align-items: flex-start; }
  @media (max-width: 600px) { .calc { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>My salary</h1>
  <nav><a href="salary.html" class="current">My salary</a><a href="index.html">Family Savings</a><a href="config.html">Config</a><span id="syncStatus" class="note"></span></nav>

  <div class="card">
    <h2 id="formTitle">Add salary</h2>
    <form id="form">
      <div><label for="salaryDate">Salary date</label><input type="date" id="salaryDate" required></div>
      <div><label for="salary">My salary</label><input type="text" inputmode="decimal" id="salary" value="0"></div>
      <div>
        <button type="submit">Save</button>
        <button type="button" class="secondary" id="cancel" hidden>Cancel</button>
      </div>
    </form>
    <div id="formError" role="alert"></div>
    <p class="note">Saving a month that already exists is not allowed: use Edit on its line. Net salary is the salary minus the rows ticked "Net salary" in Config (1%, 5% and 10% by default).</p>
  </div>

  <div class="card">
    <div class="head">
      <h2>History</h2>
      <div class="historyActions">
        <button type="button" class="secondary" id="exportSalary">Export CSV</button>
        <button type="button" class="secondary" id="chooseSalaryImport">Import CSV</button>
        <input type="file" id="salaryImportFile" accept=".csv,text/csv" hidden>
        <button type="button" class="danger" id="clearHistory">Clear history</button>
      </div>
    </div>
    <p id="salaryIoStatus" class="note" role="status" aria-live="polite"></p>
    <div class="scroll">
      <table>
        <thead>
          <tr id="foot"></tr>
            <tr id="salaryHead"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="logic.js"></script>
<script src="sync.js"></script>
<script src="settings.js"></script>
<script>
const KEY = 'familySavings';
const { fmt, esc, shiftMonth, copyEntry, remove, salaryOf, salaryTotal, salaryDateOf, defaultRowValue, currencyToUsd, netSalaryOf, netAfterRatesOf, netRowsOf, withTenth, sortDesc, setSalary, MONTHLY_PAY_UAH, MONTHLY_PAY_LABELS, DEFAULT_ROWS, payOf, setMonthlyPay, setDefaultRows, setOtherDefaults, allocationOf, setAllocation, savingOf, setMonthlySaving, investmentOf, setMonthlyInvestment, salaryLeftOf, taxOf, onePercentOf, monthLabel, rateDate, prevDate, uahToUsd, addTenthSpending } = Savings;
const RATES_KEY = 'uahUsdRates';
let family = [];
let PEOPLE = [];
let LABELS = {};
let salarySetupRows = [];
let salarySetupOther = [];
let salaryDefaultRows = [];
let salaryOtherRows = [];
let salaryPeople = [];
function refreshFamily() {
  const settings = AppSettings.load();
  family = settings.family.filter(person => person.enabled);
  salaryPeople = family.filter(person => person.showInSalary !== false)
    .map(person => ({ id: person.id, name: person.name, currency: person.currency === '%' ? 'USD' : person.currency || 'USD', sourceCurrency: person.currency || 'USD', showInSalaryFooter: person.showInSalaryFooter, person: true }));
  PEOPLE = family.map(person => person.id);
  LABELS = Object.fromEntries(family.map(person => [person.id, person.name]));
  salarySetupRows = settings.defaultRows;
  salarySetupOther = settings.otherDefaults;
  salaryDefaultRows = settings.defaultRows.filter(row => row.enabled !== false && row.showInSalary);
  salaryOtherRows = settings.otherDefaults.filter(row => row.enabled !== false && row.showInSalary);
}
refreshFamily();
const rates = JSON.parse(localStorage.getItem(RATES_KEY) || '{}');
const pending = new Set();
const rateKey = (month, currency = 'USD') => currency === 'USD' ? month : `${month}|${currency}`;
const rateOf = (month, currency = 'USD') => rates[rateKey(month, currency)];
Savings.setRateLookup(rateOf);
const $ = id => document.getElementById(id);
const open = new Set();
let data = [];
let editing = null;

const showError = text => {
  $('formError').textContent = text;
  $('formError').style.display = text ? 'block' : 'none';
};

const persist = () => { sessionStorage.setItem(KEY, JSON.stringify(data)); GitSync.schedule(); };

function resetForm() {
  editing = null;
  showError('');
  $('form').reset();
  $('salaryDate').value = new Date().toISOString().slice(0, 10);
  $('formTitle').textContent = 'Add salary';
  $('cancel').hidden = true;
}

const salaryDateLabel = e => {
  const [year, month, day] = salaryDateOf(e).split('-');
    return `${monthLabel(`${year}-${month}`).split(' ')[0]} ${Number(day)} ${year.slice(-2)}`;
};

function childHtml(e) {
  const rate = rateOf(e.month);
  const defaultRows = e.defaultRows || [];
  const isEnabled = id => !Array.isArray(e.defaultRows) || defaultRows.some(row => row.id === id && row.enabled);
  const currencies = new Set([
    ...(e.defaultRows || DEFAULT_ROWS).filter(row => row.enabled).map(row => row.currency),
    ...family.map(person => person.currency || 'USD'),
    ...(e.otherDefaults || []).filter(row => row.enabled !== false).map(row => row.currency)
  ].filter(currency => !['USD', 'UAH', '%'].includes(currency)));
  if (rate === undefined) loadRate(e.month, 'USD', salaryDateOf(e));
  currencies.forEach(currency => { if (rateOf(e.month, currency) === undefined) loadRate(e.month, currency, salaryDateOf(e)); });
  const foreignRates = Object.fromEntries([...currencies].map(currency => [currency, rateOf(e.month, currency)]));
  const usd = (amount, currency) => {
    const converted = rate ? currencyToUsd(amount, currency, rate, foreignRates, salaryOf(e)) : null;
    return converted === null ? rate === null ? 'rate unavailable' : 'loading...' : '$' + fmt(converted);
  };
  const payFields = payOf(e).map((uah, i) => {
    const id = `monthly_pay_${i}`;
    const row = defaultRows.find(item => item.id === id);
    if (!isEnabled(id)) return '';
    const currency = row ? row.currency : DEFAULT_ROWS.find(item => item.id === id).currency;
    return `<div><span>${esc(row ? row.name : MONTHLY_PAY_LABELS[i])} <input name="pay" type="number" min="0" step="0.01" value="${uah}"> ${currency}</span><strong>${usd(uah, currency)}</strong></div>`;
  });
  const alloc = allocationOf(e, family);
  const forWho = Savings.entryFamily(e, family).filter(person => person.enabled !== false).map(person => `<div><span>For ${esc(person.name)} <input name="${person.id}" type="number" min="0" step="0.01" value="${alloc[person.id]}">${person.currency && person.currency !== 'USD' ? ` ${person.currency}` : ''}</span>${person.currency && person.currency !== 'USD' ? `<strong>${usd(alloc[person.id], person.currency)}</strong>` : ''}</div>`).join('');
  const otherDefaults = (e.otherDefaults || []).filter(item => item.enabled !== false).map(item => `<div><span>${esc(item.name)} <input name="otherDefault" data-id="${esc(item.id)}" type="number" min="0" step="0.01" value="${item.amount}"> ${item.currency}</span><strong>${usd(item.amount, item.currency)}</strong></div>`).join('');
  const deductions = Array.isArray(e.defaultRows)
    ? defaultRows.filter(row => row.id.startsWith('rate_') && row.enabled)
    : [{ id: 'rate_1', name: '1% deduction' }, { id: 'rate_5', name: '5% deduction' }, { id: 'rate_10', name: '10% deduction' }];
  const deductionAmounts = { rate_1: onePercentOf(salaryOf(e), e), rate_5: taxOf(salaryOf(e), e), rate_10: fmt(e.tenth) };
  const deductionHtml = deductions.map(row => `<div><span>${esc(row.name)}</span><strong>${deductionAmounts[row.id] ?? '0.00'}</strong></div>`).join('');
  const savingCurrency = defaultRows.find(row => row.id === 'monthly_saving')?.currency || 'USD';
  const investmentCurrency = defaultRows.find(row => row.id === 'monthly_investment')?.currency || 'USD';
  const savingField = isEnabled('monthly_saving') ? `<div><span>Monthly saving ${savingCurrency} <input name="saving" type="number" min="0" step="0.01" value="${savingOf(e)}"></span></div>` : '';
  const investmentField = isEnabled('monthly_investment') ? `<div><span>Monthly investment ${investmentCurrency} <input name="investment" type="number" min="0" step="0.01" value="${investmentOf(e)}"></span></div>` : '';
  const tenthRow = defaultRows.find(row => row.id === 'tenth_spend');
  const tenthField = tenthRow && tenthRow.enabled ? `<div><span>${esc(tenthRow.name)} <input name="otherDefault" data-id="tenth_spend" type="number" min="0" step="0.01" value="${tenthRow.amount}"> ${tenthRow.currency}</span><strong>${usd(tenthRow.amount, tenthRow.currency)}</strong></div>` : '';
  const builtInFields = { monthly_saving: savingField, monthly_investment: investmentField, tenth_spend: tenthField, ...Object.fromEntries(payFields.map((html, i) => [`monthly_pay_${i}`, html])) };
  const builtIns = (Array.isArray(e.defaultRows) ? defaultRows.map(row => row.id) : Object.keys(builtInFields)).filter(id => id in builtInFields).map(id => builtInFields[id]).join('');
  return `<tr class="child"><td colspan="${5 + salaryPeople.length + salaryDefaultRows.length + salaryOtherRows.length}"><div class="calc">
    ${deductionHtml}
    <div class="rate"><span>USD rate</span><strong>${rate ? `1 USD = ${rate} UAH` : rate === null ? 'unavailable' : 'loading...'}<button type="button" class="details" data-rate="${e.month}" ${pending.has(e.month) ? 'disabled' : ''}>${pending.has(e.month) ? 'Updating...' : 'Update rate'}</button></strong></div>
    <form class="payForm" data-month="${e.month}">${builtIns}${forWho}${otherDefaults}<div class="save"><button type="submit">Save</button></div></form>
  </div></td></tr>`;
}

// NBU official rate for the month's date; looks back a few days when that date has none.
async function fetchRate(month, salaryDate, currency = 'USD') {
  let date = salaryDate && /^\d{4}-\d{2}-\d{2}$/.test(salaryDate) && salaryDate.startsWith(month)
    ? salaryDate.replace(/-/g, '')
    : rateDate(month);
  for (let i = 0; i < 5; i++) {
    const res = await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=${encodeURIComponent(currency)}&date=${date}&json`);
    if (!res.ok) throw new Error(res.status);
    const [row] = await res.json();
    if (row && row.rate > 0) return row.rate;
    date = prevDate(date);
  }
  throw new Error('no rate');
}

async function loadRate(month, currency = 'USD', salaryDate) {
  const key = rateKey(month, currency);
  if (pending.has(key)) return;
  pending.add(key);
  try {
    const entry = data.find(item => item.month === month);
    rates[key] = await fetchRate(month, salaryDate || entry && entry.salaryDate, currency);
    // Only closed months have a final rate worth keeping.
    const current = new Date().toISOString().slice(0, 7);
    const closed = Object.entries(rates).filter(([rateId, value]) => value && rateId.slice(0, 7) < current);
    localStorage.setItem(RATES_KEY, JSON.stringify(Object.fromEntries(closed)));
  } catch {
    rates[key] = null;
  }
  pending.delete(key);
  render();
}

// Net salary left of a month: a number, or 'loading' / 'unavailable' while its exchange rates are missing.
function leftState(e) {
  const rate = rateOf(e.month);
  const rows = e.defaultRows || DEFAULT_ROWS;
  const otherRows = e.otherDefaults || [];
  const currencies = new Set([
    ...rows.filter(row => row.enabled).map(row => row.currency),
    ...family.map(person => Savings.entryMember(e, person)).filter(person => person.enabled !== false).map(person => person.currency || 'USD'),
    ...otherRows.filter(row => row.enabled !== false).map(row => row.currency)
  ].filter(currency => !['USD', 'UAH', '%'].includes(currency)));
  if (rate === undefined) loadRate(e.month, 'USD', salaryDateOf(e));
  currencies.forEach(currency => { if (rateOf(e.month, currency) === undefined) loadRate(e.month, currency, salaryDateOf(e)); });
  if (rate === undefined || [...currencies].some(currency => rateOf(e.month, currency) === undefined)) return 'loading';
  if (rate === null || [...currencies].some(currency => rateOf(e.month, currency) === null)) return 'unavailable';
  const foreignRates = Object.fromEntries([...currencies].map(currency => [currency, rateOf(e.month, currency)]));
  const left = salaryLeftOf(e, rate, family, foreignRates);
  return left === null ? 'unavailable' : left;
}

const leftText = left => left === 'loading' ? 'loading...' : left === 'unavailable' ? 'rate unavailable'
  : `<span class="${left < 0 ? 'neg' : ''}">${fmt(left)}</span>`;

const leftHtml = e => leftText(leftState(e));

// Net salary of a month: a number, or 'loading' / 'unavailable' while an exchange rate its rows need is missing.
function netState(e) {
  const currencies = new Set(netRowsOf(e).filter(row => !row.id.startsWith('rate_')).map(row => row.currency || 'USD').filter(currency => currency !== 'USD' && currency !== '%'));
  if (currencies.size && rateOf(e.month) === undefined) loadRate(e.month, 'USD', salaryDateOf(e));
  currencies.forEach(currency => { if (currency !== 'UAH' && rateOf(e.month, currency) === undefined) loadRate(e.month, currency, salaryDateOf(e)); });
  const needed = currencies.size ? ['USD', ...[...currencies].filter(currency => currency !== 'UAH')] : [];
  if (needed.some(currency => rateOf(e.month, currency) === undefined)) return 'loading';
  if (needed.some(currency => rateOf(e.month, currency) === null)) return 'unavailable';
  const foreignRates = Object.fromEntries([...currencies].map(currency => [currency, rateOf(e.month, currency)]));
  const net = netAfterRatesOf(e, rateOf(e.month), foreignRates);
  return net === null ? 'unavailable' : net;
}

const netHtml = e => leftText(netState(e));

function leftTotalHtml(rows, stateOf = leftState) {
  const states = rows.map(stateOf);
  if (states.includes('loading')) return leftText('loading');
  if (states.includes('unavailable')) return leftText('unavailable');
  return leftText(states.reduce((sum, left) => sum + left, 0));
}

function applySalarySetup(entry) {
  // A row marked "New salaries only" keeps this month's own Include, amount and currency; a month that never had it does not get it.
  const defaultRows = salarySetupRows.map(row => {
    const saved = (entry.defaultRows || []).find(item => item.id === row.id);
    const builtIn = DEFAULT_ROWS.find(item => item.id === row.id);
    const amount = saved ? saved.amount : builtIn ? builtIn.amount : row.amount;
    if (!row.newSalariesOnly || !Array.isArray(entry.defaultRows)) return { ...row, amount };
    return saved
      ? { ...row, amount, enabled: saved.enabled, currency: saved.currency || row.currency, ...(saved.base ? { base: saved.base } : {}) }
      : { ...row, enabled: false };
  });
  const otherDefaults = salarySetupOther.flatMap(row => {
    const saved = (entry.otherDefaults || []).find(item => item.id === row.id);
    if (!saved) return [];
    return [row.newSalariesOnly ? { ...row, amount: saved.amount, enabled: saved.enabled, currency: saved.currency || row.currency } : { ...row, amount: saved.amount }];
  });
  return { ...entry, defaultRows, otherDefaults };
}

function render() {
  data = withTenth(sortDesc(data.map(applySalarySetup)));
  const rows = data.filter(e => salaryOf(e) > 0);
  const columns = [...salaryPeople, ...salaryDefaultRows, ...salaryOtherRows];
  const columnValue = (e, col) => {
    if (!col.person) return defaultRowValue(e, col);
    const member = Savings.entryMember(e, family.find(person => person.id === col.id));
    if (member.enabled === false) return 0;
    return member.currency === '%' ? Savings.salaryIncomeOf(e, col.id, family) : allocationOf(e, family)[col.id] || 0;
  };
  const colCount = columns.length + 5;
  $('salaryHead').innerHTML = '<th>Date</th><th>Salary</th><th>Net salary</th><th>Spending</th>' +
    columns.map(row => `<th>${esc(row.name)} (${esc(row.currency === '%' ? 'USD' : row.currency)})</th>`).join('') + '<th></th>';

  $('rows').innerHTML = rows.map(e => `
    <tr>
      <td>${esc(salaryDateLabel(e))}</td>
      <td>${fmt(salaryOf(e))}</td>
      <td>${netHtml(e)}</td>
      <td>${leftHtml(e)}</td>
      ${columns.map(row => `<td>${fmt(columnValue(e, row))}</td>`).join('')}
      <td>
        <button class="details" data-details="${e.month}">Details</button>
        <button class="copy" data-copy="${e.month}">Copy</button>
        <button class="edit" data-edit="${e.month}">Edit</button>
        <button class="danger" data-clear="${e.month}">Delete</button>
      </td>
    </tr>${open.has(e.month) ? childHtml(e) : ''}`).join('') || `<tr><td colspan="${colCount}">No salary yet</td></tr>`;

  $('foot').innerHTML = rows.length ? `<td>Total</td><td>${fmt(salaryTotal(rows))}</td><td>${leftTotalHtml(rows, netState)}</td><td>${leftTotalHtml(rows)}</td>${columns.map(row => `<td>${row.showInSalaryFooter !== false ? fmt(rows.reduce((sum, e) => sum + columnValue(e, row), 0)) : ''}</td>`).join('')}<td></td>` : '';
}

// A new salary line spends the configured UAH amount from the 10% money, converted at that month's rate.
async function addTenthForNewLine(month) {
  const settings = AppSettings.load();
  const tenthRow = settings.defaultRows.find(row => row.id === 'tenth_spend');
  const amount = settings.tenthSpendUah;
  const currency = tenthRow ? tenthRow.currency : 'UAH';
  if (!(amount > 0)) return;
  try {
    const entry = data.find(item => item.month === month);
    if (rateOf(month) === undefined) await loadRate(month, 'USD', entry && salaryDateOf(entry));
    if (currency !== 'USD' && currency !== 'UAH' && currency !== '%' && rateOf(month, currency) === undefined)
      await loadRate(month, currency, entry && salaryDateOf(entry));
    const foreignRates = currency !== 'USD' && currency !== 'UAH' && currency !== '%'
      ? { [currency]: rateOf(month, currency) }
      : {};
    data = addTenthSpending(data, month, rateOf(month), amount, currency, foreignRates);
    persist();
    render();
  } catch {
    alert(`Could not get the exchange rate, so the ${amount} UAH spending from 10% was not added for ${monthLabel(month)}.`);
  }
}

$('exportSalary').addEventListener('click', () => {
  const blob = new Blob([Savings.toSalaryCsv(data)], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'salary.csv';
  link.click();
  URL.revokeObjectURL(url);
  $('salaryIoStatus').textContent = 'Salary CSV exported.';
});

$('chooseSalaryImport').addEventListener('click', () => $('salaryImportFile').click());

$('salaryImportFile').addEventListener('change', async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    await GitSync.ready();
    const entries = Savings.parseSalaryCsv(await file.text());
    if (!confirm(`Import ${entries.length} salary row(s)? Salary values for matching months will be replaced; other saved month details will be kept.`)) return;
    const existing = new Set(data.filter(e => salaryOf(e) > 0).map(e => e.month));
    const settings = AppSettings.load();
    for (const entry of entries) {
      const current = data.find(item => item.month === entry.month);
      if (current && entry.salaryDate && salaryDateOf(current) !== entry.salaryDate) delete rates[entry.month];
    }
    data = entries.reduce((current, entry) => setSalary(current, entry.month, String(entry.salary), settings, entry.salaryDate), data);
    persist();
    render();
    $('salaryIoStatus').textContent = `${entries.length} salary row(s) imported.`;
    for (const entry of entries) {
      if (entry.salary > 0 && !existing.has(entry.month)) await addTenthForNewLine(entry.month);
    }
  } catch (err) {
    $('salaryIoStatus').textContent = err.message || 'Could not import the salary CSV.';
  } finally {
    ev.target.value = '';
  }
});

$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  const salaryDate = $('salaryDate').value;
  const month = salaryDate.slice(0, 7);
  const existing = data.find(e => e.month === month);
  if (existing && salaryOf(existing) > 0 && editing !== month) {
    showError(`${monthLabel(month)} already exists. Use Edit on its line in the history to change it.`);
    return;
  }
  showError('');
  const isNew = !(existing && salaryOf(existing) > 0);
  if (existing && salaryDateOf(existing) !== salaryDate) delete rates[month];
  data = setSalary(data, month, $('salary').value, AppSettings.load(), salaryDate);
  persist();
  render();
  resetForm();
  $('salaryDate').value = `${shiftMonth(month, 1)}-01`;
  if (isNew && salaryOf(data.find(e => e.month === month)) > 0) addTenthForNewLine(month);
});

$('cancel').addEventListener('click', resetForm);
  $('salaryDate').addEventListener('input', () => showError(''));

$('clearHistory').addEventListener('click', () => {
  if (!data.length || !confirm('Delete all months, including their income and spending? This also empties Family Savings.')) return;
  data = [];
  open.clear();
  GitSync.allowEmptyOnce();
  persist();
  render();
});

// A valid edit in a month's details is saved at once; an invalid one is flagged and not saved.
$('rows').addEventListener('change', ev => {
  const form = ev.target.form;
  if (!form || !form.classList.contains('payForm')) return;
  if (form.checkValidity()) form.requestSubmit();
  else form.reportValidity();
});

$('rows').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  const amounts = [...f.querySelectorAll('input[name=pay]')].map(i => i.value);
  const otherAmounts = Object.fromEntries([...f.querySelectorAll('input[name=otherDefault]')].map(i => [i.dataset.id, i.value]));
  const alloc = Object.fromEntries(PEOPLE.filter(p => f.elements.namedItem(p)).map(p => [p, f.elements.namedItem(p).value]));
  data = setAllocation(data, f.dataset.month, alloc);
  if (amounts.length) data = setMonthlyPay(data, f.dataset.month, amounts);
  data = setDefaultRows(data, f.dataset.month, otherAmounts);
  if (f.elements.namedItem('saving')) data = setMonthlySaving(data, f.dataset.month, f.elements.namedItem('saving').value);
  if (f.elements.namedItem('investment')) data = setMonthlyInvestment(data, f.dataset.month, f.elements.namedItem('investment').value);
  persist();
  render();
});

$('rows').addEventListener('click', ev => {
  const { edit, clear, details, copy, rate } = ev.target.dataset;
  if (rate) {
    delete rates[rate];
    render();
    loadRate(rate);
  } else if (copy) {
    const before = new Set(data.filter(e => salaryOf(e) > 0).map(e => e.month));
    data = copyEntry(data, copy);
    persist();
    render();
    const added = data.find(e => salaryOf(e) > 0 && !before.has(e.month));
    if (added) addTenthForNewLine(added.month);
  } else if (details) {
    open.has(details) ? open.delete(details) : open.add(details);
    render();
  } else if (edit) {
    const e = data.find(x => x.month === edit);
    editing = e.month;
    showError('');
    $('salaryDate').value = salaryDateOf(e);
    $('salary').value = salaryOf(e);
    $('formTitle').textContent = 'Edit salary';
    $('cancel').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (clear && confirm(`Delete ${clear}? Its line in Family Savings, with its income and spending, will be removed too.`)) {
    data = remove(data, clear);
    persist();
    render();
  }
});

resetForm();
render();
GitSync.ready().then(() => {
  refreshFamily();
  data = JSON.parse(sessionStorage.getItem(KEY) || '[]');
  render();
});
</script>
</body>
</html>
